<!DOCTYPE html>
<!-- @dsCard group="Slides" name="마무리 (Closing)" subtitle="마무리" viewport="1280x905" -->
<html lang="ko">
<head>
<meta charset="utf-8">
<title>마무리 — Closing</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../kg-slide.css">
<link rel="stylesheet" href="kg-standalone.css">
<style>
  .closing{background:radial-gradient(120% 130% at 22% 90%,#22466F 0%,#17375E 44%,#0E1C30 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:64px;}
  .closing__logo{height:56px;margin-bottom:34px;}
  .closing__line{width:54px;height:4px;background:var(--blue-500);margin:0 auto 28px;}
  .closing__thanks{font-family:var(--font-serif);font-size:46px;font-weight:700;color:#fff;letter-spacing:.01em;line-height:1.1;white-space:nowrap;}
  .closing__sub{margin-top:20px;font-size:16px;font-weight:500;color:var(--blue-200);line-height:1.6;}
  .closing__contact{margin-top:40px;display:flex;gap:0;font-size:13px;color:var(--blue-300);}
  .closing__contact div{padding:0 22px;border-right:1px solid rgba(255,255,255,.18);}
  .closing__contact div:last-child{border-right:none;}
  .closing__contact b{color:#fff;font-weight:600;}
</style>
</head>
<body>
<section class="kg-slide closing kg-root" data-screen-label="마무리">
  <img class="closing__logo" src="../assets/keynes-group-logo-shadow.png" alt="Keynes Group">
  <div class="closing__line"></div>
  <div class="closing__thanks">Thank You</div>
  <p class="closing__sub">콘텐츠산업 재투자 활성화를 위한 조세지원 실효성 제고 방안 연구<br>착수보고를 마칩니다.</p>
  <div class="closing__contact">
    <div>수행기관 <b>케인즈그룹 (Keynes Group)</b></div>
    <div>실태조사 본부 · 전략컨설팅 본부</div>
    <div><b>2026. 05. 14.</b></div>
  </div>
</section>
<script src="kg-fit.js"></script>
</body>
</html>
